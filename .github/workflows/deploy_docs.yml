name: Deploy documentation

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Run tests']
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9.13'

      - name: Get commit SHA
        run: |
          SHA=$(git rev-parse HEAD)
          echo "SHA=$SHA" >> $GITHUB_ENV

      - name: Copy requirements
        run: |
          mkdir -p temp_files
          cp requirements.txt temp_files/.

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Clean old documentation
        run: |
          cd gh-pages/
          rm -rf docs/

      - name: Paste requirements to gh-pages
        run: cp temp_files/requirements.txt gh-pages/.

      - name: Install dependencies
        run: |
          cd gh-pages/
          sudo rm -rf /usr/lib/python3/dist-packages/OpenSSL
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e git+https://github.com/${{ github.repository }}.git@${{ env.SHA }}#egg=CryptoEvolutionPackage
          pip freeze
          echo "Checking if 'source' module can be imported..."
          python -c "import importlib.util; print('EXISTS' if importlib.util.find_spec('source') else 'NOT FOUND')"

      - name: Generate documentation
        run: |
          cd gh-pages/
          echo "===== Setting PYTHONPATH to include installed package ====="
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/src/cryptoevolutionpackage"
          echo "PYTHONPATH: $PYTHONPATH"
          python -c "import importlib.util; spec = importlib.util.find_spec('source'); print('source found at:', spec.origin if spec else 'NOT FOUND')"
          make html
        env:
          PYTHONPATH: '${{ github.workspace }}/gh-pages/src/cryptoevolutionpackage'

      - name: Add personalized index.html
        run: |
          cd gh-pages
          python scripts/generate_index.py | tee index.html

      - name: Configure Git
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Push changes
        run: |
          cd gh-pages
          rm -rf src/cryptoevolutionpackage || true
          git add .
          git status
          git commit -m "[DOC] Deploy documentation from ${{ github.sha }}"
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
